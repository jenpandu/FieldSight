[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldsight"
version = "0.1.0"
description = "Multi-agent copilot that reads OSHA incident packets, grounds findings in regulatory text, and drafts a cited dossier for human review."
requires-python = ">=3.11"
authors = [{name = "FieldSight Team", email = "team@fieldsight.local"}]
license = {text = "MIT"}

dependencies = [
    "boto3==1.35.14",
    "botocore==1.32.14",
    "langgraph==0.1.5",
    "langchain-core==0.1.33",
    "langchain-aws==0.1.11",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "psycopg[binary]==3.19.1",
    "pgvector==0.2.4",
    "alembic==1.13.1",
    "flask==3.0.0",
    "python-dotenv==1.0.0",
    "click==8.1.7",
    "rich==13.7.0",
    "httpx==0.27.0",
    "pydantic-json-schema==2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
    "ruff==0.2.1",
    "mypy==1.8.0",
    "black==24.1.1",
]

[project.scripts]
fieldsight = "fieldsight.cli.main:cli"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "B", "C4", "PIE", "PT", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=fieldsight --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
